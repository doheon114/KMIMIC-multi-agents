[project]
name = "hf-pathguard"
version = "0.2.0"
description = "Safety-aware clinical multi-agent hackathon prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.8,<3", "pandas>=2.2,<3", "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2", "langchain-openai>=1.0,<2",
  "streamlit>=1.43,<2", "httpx>=0.27,<1", "python-dotenv>=1.0,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
